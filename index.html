<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="WESTROOMZ - Audio, Video & Event Production Agency.">
    <title>WESTROOMZ | Audio. Video. Events.</title>
    
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

    <style>
        button, .tab-btn, .submit-btn, .book-btn, .menu-link { border-radius: 30px !important; }
        input, select, textarea { border-radius: 12px !important; }
        .gallery-item img { border-radius: 12px !important; }
        .contact-form, .service-container, .modal-content-wrapper { border-radius: 20px !important; }
        .menu-toggle-btn { border-radius: 8px !important; }
        
        .ref-logo-img { height: 100px !important; width: auto !important; opacity: 1 !important; filter: none !important; margin: 0 40px !important; border-radius: 8px !important; object-fit: contain; }
        .marquee-track { display: flex; align-items: center; width: max-content !important; gap: 0 !important; animation: marquee-scroll 40s linear infinite !important; }
        @keyframes marquee-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .marquee-wrapper { overflow: hidden !important; width: 100% !important; display: flex !important; }

        .ref-section {
            border-radius: 40px !important; margin: 0 !important; position: relative !important;
            background: radial-gradient(circle at center, #0a0a0a 0%, #050505 100%) !important;
            border: 1px solid rgba(153, 0, 0, 0.15) !important;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8) !important; overflow: hidden !important; padding: 100px 0 !important;
        }

        .ref-section::before {
            content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 40%; height: 80%; background-image: url('logo.jpg') !important; background-repeat: no-repeat;
            background-position: center; background-size: contain; opacity: 0.05; mix-blend-mode: lighten; 
            filter: grayscale(100%) contrast(120%); z-index: 0; pointer-events: none;
        }

        .ref-section > div, .marquee-wrapper { position: relative; z-index: 2; }
        .gallery-section { background: transparent !important; border-top: none !important; border-bottom: none !important; }

        .gallery-container { animation: none !important; cursor: grab !important; will-change: transform; }
        .gallery-container:active { cursor: grabbing !important; }
        .gallery-item img { pointer-events: none !important; user-select: none !important; -webkit-user-drag: none !important; }

        .site-toggle-container {
            display: flex; justify-content: center; align-items: center; gap: 20px;
            font-family: 'Oswald', sans-serif; color: #fff; pointer-events: auto; margin-bottom: 30px;
        }
        .toggle-label { font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; color: #aaaaaa; transition: color 0.3s, text-shadow 0.3s; }
        .site-toggle-container.is-creators .label-creators,
        .site-toggle-container.is-business .label-business { color: #ff0000; text-shadow: 0 0 15px rgba(255, 0, 0, 0.6); }

        .ios-switch { position: relative; display: inline-block; width: 80px; height: 44px; cursor: pointer; }
        .ios-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255, 255, 255, 0.2); transition: .4s; border: 2px solid rgba(255, 255, 255, 0.3); }
        .slider:before { position: absolute; content: ""; height: 32px; width: 32px; left: 4px; bottom: 4px; background-color: white; transition: .4s; }
        input:checked + .slider { background-color: #990000; border-color: #ff0000; }
        input:checked + .slider:before { transform: translateX(36px); }
        .slider.round { border-radius: 50px; }
        .slider.round:before { border-radius: 50%; }

        @media (max-width: 768px) {
            .site-toggle-container { gap: 12px; margin-bottom: 20px; }
            .toggle-label { font-size: 1.1rem; }
            .ios-switch { width: 60px; height: 34px; }
            .slider:before { height: 24px; width: 24px; bottom: 3px; left: 3px; }
            input:checked + .slider:before { transform: translateX(26px); }
        }

        @media (min-width: 769px) {
            .hero .video-container { background-image: none !important; background-color: transparent !important; }
            .hero-video { display: block !important; opacity: 0.8 !important; }
        }

        /* ========================================================
           === HIGH-END VISION SECTION === 
           ======================================================== */
        .vision-section { 
            display: flex; flex-direction: column; align-items: center; text-align: center; 
            padding: 150px 5%; /* Mehr Breathing Room */
            position: relative;
            z-index: 10;
        }

        /* Der Background-Blur bleibt, um das Bild darunter abzuheben */
        .vision-section::before {
            content: ''; position: absolute; top: -2px; left: 0; width: 100%; height: 35vh; 
            background: linear-gradient(to bottom, #000 0%, rgba(0,0,0,0.8) 20%, transparent 100%);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
            pointer-events: none; z-index: -1; 
        }

        .vision-content { 
            max-width: 900px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .big-lead { 
            font-family: var(--font-head); /* Oswald, wie in deinem Originalcode */
            font-size: clamp(2.5rem, 6vw, 4.5rem); 
            text-transform: uppercase; line-height: 1.1; margin-bottom: 0; letter-spacing: 0.05em; 
            color: #ffffff; text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            /* GSAP Start-Status */
            opacity: 0; transform: translateY(30px);
        }

        /* Der animierte Rote Faden + Pulsierender Punkt */
        .vision-indicator { display: flex; flex-direction: column; align-items: center; margin: 40px 0 50px 0; }
        .v-line { width: 1px; height: 100px; background: linear-gradient(to bottom, rgba(220,38,38,0), #dc2626); transform-origin: top; transform: scaleY(0); }
        .v-dot { width: 6px; height: 6px; background-color: #dc2626; border-radius: 50%; position: relative; box-shadow: 0 0 10px #dc2626; opacity: 0; transform: scale(0); }
        .v-dot-pulse {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 24px; height: 24px; background-color: rgba(220,38,38,0.4); border-radius: 50%;
            animation: vision-pulse 2.5s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
        }
        @keyframes vision-pulse { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }

        /* Typografische Hierarchie für den Text */
        .vision-text { display: flex; flex-direction: column; gap: 24px; max-width: 720px; margin: 0 auto; }
        .vision-text p { margin: 0; opacity: 0; transform: translateY(20px); } /* GSAP Start-Status */
        
        .lead-text { font-family: 'Inter', sans-serif; font-size: clamp(1.15rem, 2.5vw, 1.45rem); font-weight: 400; color: #ffffff; line-height: 1.6; }
        .sub-text { font-family: 'Inter', sans-serif; font-size: clamp(0.95rem, 1.8vw, 1.125rem); font-weight: 300; color: #a3a3a3; line-height: 1.7; }

        @media (max-width: 768px) { .premium-footer { border-top-left-radius: 40px; border-top-right-radius: 40px; padding: 60px 16px 40px 16px; margin-top: 40px; } }

        .footer-form-card { background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01)); border: 1px solid rgba(255,255,255,0.08); border-radius: 32px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); }
        @media (max-width: 768px) { .footer-form-card { padding: 30px 20px; border-radius: 24px; } }

        .footer-brand { grid-column: 1 / -1; }
        @media (min-width: 1024px) { .footer-links-section { grid-template-columns: 2fr 1fr 1fr; gap: 80px; } .footer-brand { grid-column: auto; } }

        .footer-brand .brand-icon { width: 32px; height: 32px; background-color: #dc2626; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: 900; transition: transform 0.3s; }
        .footer-brand .brand-logo:hover .brand-icon { transform: rotate(12deg); }
        .footer-brand .brand-name { font-weight: 900; font-size: 1.25rem; letter-spacing: -0.5px; }
        .footer-brand p { color: #a3a3a3 !important; font-size: 0.875rem; font-style: italic; max-width: 300px; margin-bottom: 32px; line-height: 1.6; }
        .footer-socials-new { display: flex; gap: 12px; }
        .footer-socials-new a { display: flex; justify-content: center; align-items: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); color: #ffffff !important; transition: all 0.3s; }
        .footer-socials-new a:hover { background-color: rgba(255,255,255,0.05); color: #dc2626 !important; border-color: rgba(255,255,255,0.2); }
        .footer-socials-new svg { width: 16px; height: 16px; fill: currentColor; }
