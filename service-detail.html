<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WESTROOMZ | Service Detail</title>
    <link rel="icon" type="image/jpg" href="logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

    <style>
        /* 1. Dieser Block feuert NUR, wenn die Klasse 'audio-theme' aktiv ist */
        .audio-theme.detail-list-wrapper {
            /* Kombiniert einen abdunkelnden "Nebel" in der Mitte mit deinem Plugin-Bild */
            background-image: 
                radial-gradient(circle at center, rgba(0, 0, 0, 0.85) 15%, rgba(0, 0, 0, 0.4) 40%, transparent 70%),
                url('WR_Plugin.png') !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-color: #050505 !important;
            border: none !important;
        }

        /* 2. Macht die Menüpunkte im Audio-Bereich hellgrau und gibt ihnen einen starken schwarzen Schatten */
        .audio-theme .detail-list-container div {
            color: #e0e0e0 !important; /* Helles Grau für perfekten Kontrast zum Metall */
            text-shadow: 
                0px 2px 4px rgba(0, 0, 0, 1), 
                0px 0px 15px rgba(0, 0, 0, 1), 
                0px 0px 30px rgba(0, 0, 0, 0.9) !important;
        }

        /* Sichert ab, dass das rote leuchtende Element (z.B. MASTERING) rot bleibt, aber den Schatten bekommt */
        .audio-theme .detail-list-container div[style*="color: red"],
        .audio-theme .detail-list-container div[style*="color: rgb(255, 0, 0)"],
        .audio-theme .detail-list-container .active {
            text-shadow: 
                0px 2px 4px rgba(0, 0, 0, 1), 
                0px 0px 15px rgba(0, 0, 0, 1) !important;
        }
    </style>

    <script>
        // 3. Prüft beim Laden der Seite, ob wir uns im Audio-Bereich befinden
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            // Wenn in der URL das Wort "audio" vorkommt...
            if (id && id.toLowerCase().includes('audio')) {
                // ...suchen wir den Kasten und geben ihm die neue Optik
                const wrapper = document.querySelector('.detail-list-wrapper');
                if (wrapper) {
                    wrapper.classList.add('audio-theme');
                }
            }
        });
    </script>
</head>
