<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WESTROOMZ | Service Detail</title>
    <link rel="icon" type="image/jpg" href="logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Oswald:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Draggable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.29/bundled/lenis.min.js"></script>

    <style>
        /* --- DESKTOP EINSTELLUNGEN --- */
        .detail-list-wrapper {
            /* Dateiname auf .jpg aktualisiert */
            background-image: url('WR_Plugin.jpg') !important;
            background-size: 100% 100% !important; 
            background-position: center center !important; 
            background-repeat: no-repeat !important;
            background-color: #08090a !important; 
            border: none !important;
            border-radius: 20px !important; 
            overflow: hidden !important; 
            min-height: 720px !important; 
            height: auto !important;
            padding-bottom: 25px !important; 
        }

        .detail-list-container {
            margin-top: 90px !important; 
        }

        .detail-list-wrapper h3 {
            border-bottom: 1px solid rgba(255, 255, 255, 0.2) !important; 
            padding-bottom: 15px !important;
            margin-bottom: 20px !important;
            width: 60% !important; 
            margin-left: auto !important; 
            margin-right: auto !important; 
        }
        
        .detail-list-container::before {
             display: none !important; 
        }

        /* ==========================================================
           NEU: ROUTE 1 "ECLIPSE" (Massiver schwarzer Schatten)
           ========================================================== */
           
        /* 1. Das aktive Wort bleibt knallrot, bekommt aber eine harte schwarze Kante und tiefen Schatten */
        #detailList div[style*="color: rgb(255, 0, 0)"],
        #detailList div[style*="color: red"],
        #detailList .active {
            color: #ff0000 !important; /* Knalliges Rot */
            font-weight: 700 !important; /* Etwas fetter, damit es sich besser durchsetzt */
            text-shadow: 
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000, /* Harte schwarze Outline (4-fach für Schärfe) */
                 0px 0px 15px rgba(0, 0, 0, 1), /* Dichter, tiefer schwarzer Kernschatten */
                 0px 0px 40px rgba(0, 0, 0, 0.9) !important; /* Breiter schwarzer Umgebungsschatten */
        }

        /* 2. Inaktive Wörter werden heller (grau) mit scharfem Schatten für Lesbarkeit auf Metall */
        #detailList div:not([style*="color: rgb(255, 0, 0)"]):not([style*="color: red"]) {
            color: #999999 !important; /* Helles Grau */
            text-shadow: 0px 1px 4px rgba(0,0,0,1) !important; /* Harter Schatten für Kontrast */
        }
        /* ========================================================== */


        /* --- DESKTOP TEXT-KORREKTUREN --- */
        @media (min-width: 769px) {
            #detailList {
                width: 100% !important;
                max-width: 1150px !important; 
                margin-left: auto !important;
                margin-right: auto !important;
            }
            
            #detailList div {
                white-space: normal !important; 
                line-height: 1.5 !important;
            }

            #detailList div[style*="absolute"] {
                font-size: 22px !important; 
                font-weight: 500 !important;
                letter-spacing: 2.5px !important; 
                white-space: nowrap !important; 
            }
        }

        /* --- MOBILE EINSTELLUNGEN --- */
        @media (max-width: 768px) {
            .detail-list-wrapper {
                background-image: url('Firefly_Gemini Flash.jpg') !important; 
                background-size: cover !important; 
                background-position: center top !important;
                background-repeat: no-repeat !important;
                width: 100% !important; 
                min-height: unset !important; 
                height: auto !important; 
                aspect-ratio: auto !important;
                padding-bottom: 40px !important; 
            }
            .detail-list-container {
                margin-top: 95px !important; 
            }
            .detail-desc {
                margin-bottom: 10px !important;
            }
        }
    </style>
</head>
<body>
   <div class="global-bg"></div>

    <div class="cursor-ring"></div>

    <div class="back-home-wrapper">

    </div>

    <div class="side-menu">
        <div><div class="side-logo"><img src="IMG_4834.png" alt="WESTROOMZ"></div><div class="menu-links"><a href="index.html" class="menu-link interactive">START</a><a href="index.html#vision" class="menu-link interactive">VISION</a><a href="index.html#contact" class="menu-link interactive">KONTAKT</a></div></div>
        <div class="sidebar-footer"><a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a><a href="agb.html">AGB</a></div>
    </div>
    <div class="menu-overlay" onclick="toggleMenu()"></div>

    <main class="page-wrapper">
        <header class="detail-hero">
            <img id="detailBg" src="" alt="Service Background" class="detail-hero-bg">
            <div class="hero-overlay"></div>
            <h1 id="detailTitle">LOADING...</h1>
        </header>

        <section class="detail-content">
            <div class="detail-desc">
                <h2 id="detailIntro"></h2>
                <p id="detailDesc"></p>
                <button id="detailContactBtn" class="book-btn interactive">JETZT ANFRAGEN</button>
            </div>
            
            <div class="detail-list-wrapper glass-kinetic-box">
                <h3>LEISTUNGEN</h3>
                <div id="detailList" class="detail-list-container"></div>
            </div>
        </section>

        <footer>
            <div class="footer-socials"><a href="#" class="social-icon interactive">INSTAGRAM</a><a href="#" class="social-icon interactive">LINKEDIN</a></div>
            <div class="footer-nav"><a href="impressum.html" class="interactive">IMPRESSUM</a><a href="datenschutz.html" class="interactive">DATENSCHUTZ</a><a href="agb.html" class="interactive">AGB</a></div>
            <p class="copyright">&copy; 2026 WESTROOMZ. ALLE RECHTE VORBEHALTEN.</p>
        </footer>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
